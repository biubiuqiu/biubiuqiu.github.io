      <dialog class="photo-viewer" aria-labelledby="photo-viewer-title" data-loading="{{gallery_loading}}" data-error="{{gallery_error}}">
        <header class="photo-toolbar"><span class="photo-title" id="photo-viewer-title">{{gallery_title}}</span><div class="photo-actions"><a class="photo-separate" target="_blank" rel="noopener noreferrer">{{gallery_open}}<span aria-hidden="true"> ↗</span></a><button class="photo-close photo-control glass-control" type="button" aria-label="{{gallery_close}}" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div></header>
        <div class="photo-stage" aria-busy="false"><img class="photo-image" alt="" hidden><p class="photo-status" role="status" hidden></p></div>
        <footer class="photo-bottom"><button class="photo-prev photo-control glass-control" type="button" aria-label="{{gallery_prev}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><div class="photo-info" aria-live="polite" aria-atomic="true"><p class="photo-caption"></p><p class="photo-counter"></p></div><button class="photo-next photo-control glass-control" type="button" aria-label="{{gallery_next}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button><p class="photo-help"><span class="photo-keys">{{gallery_keys}}</span><span class="photo-touch">{{gallery_swipe}}</span></p></footer>
      </dialog>
